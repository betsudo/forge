<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 739" role="img" aria-labelledby="title desc"><title id="title">CLI prepare: hit and miss</title><desc id="desc">Both hit and miss return verified exported artifacts; actual proof and assertion tests still execute.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a5a5ff"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e8e8f4;font-size:15px}.muted{fill:#aaaaba;font-size:13px}.box{fill:#191925;stroke:#555575}.line{stroke:#a5a5ff;stroke-width:1.5;marker-end:url(#arrow)}.life{stroke:#555568;stroke-dasharray:5 5}</style><rect width="920" height="739" fill="#111218"/><rect class="box" x="10" y="20" width="170" height="52" rx="8"/><text x="95.0" y="46" text-anchor="middle" class="">Test / adapter</text><line class="life" x1="95" y1="72" x2="95" y2="684"/><rect class="box" x="250" y="20" width="170" height="52" rx="8"/><text x="335.0" y="46" text-anchor="middle" class="">Forge CLI</text><line class="life" x1="335" y1="72" x2="335" y2="684"/><rect class="box" x="490" y="20" width="170" height="52" rx="8"/><text x="575.0" y="46" text-anchor="middle" class="">Store / backend</text><line class="life" x1="575" y1="72" x2="575" y2="684"/><rect class="box" x="730" y="20" width="170" height="52" rx="8"/><text x="815.0" y="46" text-anchor="middle" class="">Proof + verifier</text><line class="life" x1="815" y1="72" x2="815" y2="684"/><line class="line" x1="95" y1="110" x2="335" y2="110"/><text x="215.0" y="98" text-anchor="middle" class="muted">prepare current circuit.zkir</text><line class="line" x1="335" y1="178" x2="575" y2="178"/><text x="455.0" y="166" text-anchor="middle" class="muted">hash source + exact recipe; writer lease</text><line class="line" x1="575" y1="246" x2="335" y2="246"/><text x="455.0" y="234" text-anchor="middle" class="muted">HIT: verify stored artifact bytes</text><line class="line" x1="335" y1="314" x2="575" y2="314"/><text x="455.0" y="302" text-anchor="middle" class="muted">MISS only: generate keys, pin outputs</text><line class="line" x1="575" y1="382" x2="335" y2="382"/><text x="455.0" y="370" text-anchor="middle" class="muted">publish verified CAS + export</text><line class="line" x1="335" y1="450" x2="95" y2="450"/><text x="215.0" y="438" text-anchor="middle" class="muted">JSON: identities + export paths + hit</text><line class="line" x1="95" y1="518" x2="815" y2="518"/><text x="455.0" y="506" text-anchor="middle" class="muted">both paths: generate proof, verify, assert</text><line class="line" x1="815" y1="586" x2="95" y2="586"/><text x="455.0" y="574" text-anchor="middle" class="muted">test result + negative controls</text><text x="460" y="719" text-anchor="middle" class="muted">The cache stores circuit artifacts, never proof success or test outcomes.</text></svg>