<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc"><title id="title">Forge artifact architecture</title><desc id="desc">CLI and HTTP share an application, metadata, CAS and pinned backends. Artifacts feed a ZK config provider and a separate proof provider.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a5a5ff"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#e8e8f4;font-size:15px}.muted{fill:#aaaaba;font-size:13px}.box{fill:#191925;stroke:#555575}.line{stroke:#a5a5ff;stroke-width:1.5;marker-end:url(#arrow)}.life{stroke:#555568;stroke-dasharray:5 5}</style><rect width="920" height="520" fill="#111218"/><rect class="box" x="30" y="30" width="190" height="60" rx="8"/><text x="125.0" y="56" text-anchor="middle" class="">CLI / test adapter</text><rect class="box" x="30" y="125" width="190" height="60" rx="8"/><text x="125.0" y="151" text-anchor="middle" class="">HTTP client</text><rect class="box" x="300" y="65" width="270" height="100" rx="8"/><text x="435.0" y="91" text-anchor="middle" class="">Forge application</text><text x="435.0" y="113" text-anchor="middle" class="">identity + integrity checks</text><text x="435.0" y="135" text-anchor="middle" class="">one SQLite writer lease</text><line class="line" x1="220" y1="60" x2="300" y2="95"/><line class="line" x1="220" y1="155" x2="300" y2="130"/><rect class="box" x="670" y="25" width="220" height="75" rx="8"/><text x="780.0" y="51" text-anchor="middle" class="">SQLite metadata</text><text x="780.0" y="73" text-anchor="middle" class="">recipes, readiness, stats</text><rect class="box" x="670" y="125" width="220" height="75" rx="8"/><text x="780.0" y="151" text-anchor="middle" class="">Artifact storage</text><text x="780.0" y="173" text-anchor="middle" class="">CAS + copied exports</text><line class="line" x1="570" y1="85" x2="670" y2="65"/><line class="line" x1="570" y1="135" x2="670" y2="155"/><rect class="box" x="300" y="230" width="270" height="80" rx="8"/><text x="435.0" y="256" text-anchor="middle" class="">Pinned v2 / v3 backends</text><text x="435.0" y="278" text-anchor="middle" class="">verified public parameters</text><line class="line" x1="435" y1="165" x2="435" y2="230"/><text x="515" y="205" text-anchor="middle" class="muted">miss only</text><rect class="box" x="40" y="370" width="260" height="95" rx="8"/><text x="170.0" y="396" text-anchor="middle" class="">Filesystem export / download</text><text x="170.0" y="418" text-anchor="middle" class="">ZKConfigProvider</text><text x="170.0" y="440" text-anchor="middle" class="">ZKIR + prover / verifier keys</text><rect class="box" x="370" y="370" width="225" height="95" rx="8"/><text x="482.5" y="396" text-anchor="middle" class="">ProofProvider</text><text x="482.5" y="418" text-anchor="middle" class="">generate a real proof</text><rect class="box" x="665" y="370" width="225" height="95" rx="8"/><text x="777.5" y="396" text-anchor="middle" class="">Consumer / verifier</text><text x="777.5" y="418" text-anchor="middle" class="">verify + assert</text><line class="line" x1="300" y1="135" x2="170" y2="370"/><line class="line" x1="300" y1="417" x2="370" y2="417"/><line class="line" x1="595" y1="417" x2="665" y2="417"/><text x="460" y="500" text-anchor="middle" class="muted">HTTP object URLs need an adapter; no FetchZkConfigProvider layout endpoint yet.</text></svg>