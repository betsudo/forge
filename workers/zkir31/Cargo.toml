[package]
name = "midnight-zkir-forge-zkir31-worker"
version = "2026.10.0"
edition = "2024"
license = "Apache-2.0"
description = "Isolated pinned ZKIR3.1 backend for Midnight ZKIR Forge"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
midnight-zkir-v3 = { package = "midnight-zkir", git = "https://github.com/midnightntwrk/midnight-zkir", rev = "e82d81d25aabcc5f5092e2bd559083487f577914" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-proofs = "=0.8.2"
midnight-circuits = "=7.2.4"
midnight-curves = "=0.3.1"
midnight-zk-stdlib = "=2.3.5"
rand = "0.8"
libc = "0.2"


[dev-dependencies]

[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

# Separate workspace and lock: consumer v3 dependencies must not unify with v2.
[workspace]

[patch.crates-io]
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
midnight-storage-core = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "9a8777c4d035fc7f38ae286bcf5f8656668efd9f" }
