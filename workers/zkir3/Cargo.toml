[package]
name = "midnight-zkir-forge-zkir3-worker"
version = "2026.10.0-rc.1"
edition = "2024"
license = "Apache-2.0"
description = "Isolated pinned ZKIR3 backend for Midnight ZKIR Forge"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
midnight-zkir-v3 = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "3a7ae0361d03e6eed4fc91e31f6600f334f605d5" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "3a7ae0361d03e6eed4fc91e31f6600f334f605d5" }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "3a7ae0361d03e6eed4fc91e31f6600f334f605d5" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "3a7ae0361d03e6eed4fc91e31f6600f334f605d5" }
midnight-proofs = "=0.8.3"
midnight-circuits = "=6.1.0"
midnight-curves = "=0.2.0"
midnight-zk-stdlib = "=1.1.0"
rand = "0.8"
libc = "0.2"


[dev-dependencies]

[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

# Separate workspace and lock: consumer v3 dependencies must not unify with v2.
[workspace]
