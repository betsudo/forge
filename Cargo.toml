[package]
name = "midnight-zkir-forge"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Local content-addressed Midnight ledger8 circuit artifact cache"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
midnight-zkir = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
midnight-base-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
midnight-serialize = { git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
midnight-proofs = "=0.7.1"
midnight-circuits = "=6.1.0"
midnight-curves = "=0.2.0"
midnight-zk-stdlib = "=1.1.0"
rand = "0.8"

tempfile = "3"

[dev-dependencies]

[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2
