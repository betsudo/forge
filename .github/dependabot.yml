version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: cargo
    directories: [/, /workers/zkir3, /workers/zkir31]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /integration/providers
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
# Updates are proposals, never auto-merged. Official crypto/compiler pins require
# explicit qualification. Bot PRs need a human signed issue-linked delivery.
