name: Local-contract checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      real_proofs:
        description: Fetch verified official parameters and run genuine proof e2e tests
        type: boolean
        default: false
permissions:
  contents: read
# Three isolated proof-stack graphs must fit the hosted runner disk.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
      - name: Reuse locked Rust build dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: forge-lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'workers/zkir3/Cargo.lock', 'workers/zkir31/Cargo.lock', 'flake.lock') }}
          restore-keys: forge-lean-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Locked profiles, specs, formatting, unit tests, Clippy, HTTP e2e and docs
        run: ./bootstrap.sh --check

  real-proofs:
    if: github.event_name == 'workflow_dispatch' && inputs.real_proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 2
            cores = 2
      - name: Reuse locked Rust build dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: forge-lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'workers/zkir3/Cargo.lock', 'workers/zkir31/Cargo.lock', 'flake.lock') }}
          restore-keys: forge-lean-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build both locked backends
        run: |
          ./bootstrap.sh -- cargo build --locked --manifest-path workers/zkir3/Cargo.toml --target-dir target
          ./bootstrap.sh -- cargo build --locked
          ./bootstrap.sh -- cargo build --locked --example qualify-http-fixture
      - name: Fetch verified parameters and execute proof and HTTP e2e controls
        run: |
          export MIDNIGHT_ZKIR_FORGE_ZKIR3_WORKER="$PWD/target/debug/midnight-zkir-forge-zkir3-worker"
          ./bootstrap.sh -- target/debug/zkir-forge --fetch-params qualify
          ./bootstrap.sh -- target/debug/zkir-forge --profile zkir3 --fetch-params qualify
          ./bootstrap.sh -- cargo test --locked --test real_backend -- --ignored --test-threads=1
          ./bootstrap.sh -- cargo test --locked --test zkir3 -- --ignored --test-threads=1
          ./bootstrap.sh -- python3 scripts/check-http.py --binary target/debug/zkir-forge --real
          ./bootstrap.sh -- python3 scripts/check-snapshot.py --binary target/debug/zkir-forge --real

  quality-gate:
    name: Forge quality gate
    if: always()
    needs: [checks, real-proofs]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all mandatory checks
        env:
          EXPECT_PROOFS: ${{ github.event_name == 'workflow_dispatch' && inputs.real_proofs }}
          PROOF_RESULT: ${{ needs.real-proofs.result }}
          CHECK_RESULT: ${{ needs.checks.result }}
        run: |
          test "$CHECK_RESULT" = success
          if [ "$EXPECT_PROOFS" = true ]; then
            test "$PROOF_RESULT" = success
          else
            test "$PROOF_RESULT" = skipped
          fi
